name: pgacc-test

services:
  # PGACC_TEST_PG_* are set by tests/postgres-version.sh (PGACC_TEST_PG); the
  # defaults are the PostgreSQL 17 server. database-test uses the same image so
  # that psql matches the server version.
  database:
    image: ${PGACC_TEST_PG_IMAGE:-postgres:17-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0}
    environment:
      POSTGRES_DB: accounting
      POSTGRES_USER: pgacc_test
      POSTGRES_PASSWORD: pgacc_test
      TZ: UTC
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=pgacc_test --dbname=accounting"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - test
    tmpfs:
      - ${PGACC_TEST_PG_DATA:-/var/lib/postgresql/data}

  php-lint:
    image: php:7.4.33-cli-bullseye@sha256:620a6b9f4d4feef2210026172570465e9d0c1de79766418d3affd09190a7fda5
    command: ["sh", "tests/lint.sh"]
    init: true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - .:/app:ro
    working_dir: /app

  database-test:
    image: ${PGACC_TEST_PG_IMAGE:-postgres:17-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0}
    depends_on:
      database:
        condition: service_healthy
    environment:
      PGHOST: database
      PGPORT: "5432"
      PGDATABASE: accounting
      PGUSER: pgacc_test
      PGPASSWORD: pgacc_test
      TZ: UTC
    command: ["sh", "tests/database-smoke.sh"]
    init: true
    networks:
      - test
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - .:/app:ro
    working_dir: /app

  application:
    image: pgacc-test-application${PGACC_TEST_SUFFIX:-}
    build:
      context: .
      dockerfile: tests/php-runtime.Dockerfile
    depends_on:
      database:
        condition: service_healthy
    environment:
      PGHOST: database
      PGPORT: "5432"
      PGDATABASE: accounting
      PGUSER: pgacc_test
      PGPASSWORD: pgacc_test
      PGACC_TEST_DIAGNOSTICS_DIR: /diagnostics
      TZ: UTC
    command:
      - php
      - -d
      - output_buffering=4096
      - -d
      - auto_prepend_file=/app/tests/runtime/diagnostics-prepend.php
      - -S
      - 0.0.0.0:8080
      - -t
      - /app
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "exit(@fsockopen('127.0.0.1', 8080) ? 0 : 1);"
      interval: 2s
      timeout: 3s
      retries: 30
    init: true
    networks:
      - test
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - diagnostics:/diagnostics
      - receipts:/app/files

  application-test:
    image: pgacc-test-application${PGACC_TEST_SUFFIX:-}
    depends_on:
      application:
        condition: service_healthy
    environment:
      PGACC_TEST_BASE_URL: http://application:8080
      PGHOST: database
      PGPORT: "5432"
      PGDATABASE: accounting
      PGUSER: pgacc_test
      PGPASSWORD: pgacc_test
      PGACC_TEST_DIAGNOSTICS_DIR: /diagnostics
      TZ: UTC
    command: ["sh", "tests/application-tests.sh"]
    init: true
    networks:
      - test
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - diagnostics:/diagnostics
      # tests/http-receipts.php checks and plants the server's receipt files.
      - receipts:/app/files

networks:
  test:
    internal: true

volumes:
  # Per-request PHP diagnostics written by tests/runtime/diagnostics-prepend.php
  # on the test servers and read by the HTTP tests. Removed with the project.
  diagnostics:
    driver_opts:
      type: tmpfs
      device: tmpfs
  # The application's files/ directory (receipt storage), shared with the
  # tests. Synthetic receipts only; removed with the project.
  receipts:
    driver_opts:
      type: tmpfs
      device: tmpfs

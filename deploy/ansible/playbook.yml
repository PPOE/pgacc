---
# Sets up a Debian 13 (trixie) host for pgacc. See deploy/README.md.
#
#   ansible-playbook -i inventory.yml deploy/ansible/playbook.yml
#
# Never changes an existing constants.php, files/ or database.
- name: Provision a pgacc host
  hosts: all
  become: true
  # Handlers (reloads, the constants.php notice) run even if a later task fails.
  force_handlers: true
  # Settings (inventory variables): pgacc_trusted_proxies (required),
  # pgacc_timezone (default UTC), pgacc_backup_keep_days (default 7).
  vars:
    pgacc_proxies: "{{ pgacc_trusted_proxies | default([]) }}"
    pgacc_fixtures: "{{ playbook_dir }}/../../tests/fixtures"

  handlers:
    - name: Reload php-fpm
      ansible.builtin.systemd_service:
        name: php8.5-fpm.service
        state: reloaded

    - name: Check nginx
      ansible.builtin.command: nginx -t -q
      changed_when: false
      listen: Reload nginx

    - name: Reload nginx service
      ansible.builtin.systemd_service:
        name: nginx.service
        state: reloaded
      listen: Reload nginx

    - name: Announce the new constants.php
      ansible.builtin.debug:
        msg: >-
          Generated /srv/pgacc/shared/constants.php with a new random $key.
          Copy it off this host now. Replace $datakey with the membership
          key. When moving an installation, replace the file with the old one
          before the first deploy.

  tasks:
    - name: Check the settings
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Debian' and ansible_distribution_release == 'trixie'
          - pgacc_proxies | length > 0
          - pgacc_proxies | reject('match', '^[0-9A-Fa-f.:]+(/[0-9]{1,3})?$') | list | length == 0
          - pgacc_backup_keep_days | default(7) | int > 0
        fail_msg: >-
          Needs Debian 13 and pgacc_trusted_proxies: the addresses or CIDR
          ranges of the TLS-terminating reverse proxy (X-Forwarded-Proto is
          trusted only from them).

    # --- Packages: PostgreSQL from apt.postgresql.org, PHP from packages.sury.org

    - name: Install the base packages
      ansible.builtin.apt:
        name: [ca-certificates, curl, postgresql-common, sudo, logrotate]
        install_recommends: false
        update_cache: true
        cache_valid_time: 3600

    - name: Add the PostgreSQL repository (postgresql-common's script)
      ansible.builtin.command: /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
      args:
        creates: /etc/apt/sources.list.d/pgdg.sources

    - name: Install the packages.sury.org keyring
      ansible.builtin.apt:
        deb: https://packages.sury.org/debsuryorg-archive-keyring.deb

    - name: Add the packages.sury.org PHP repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/php.sources
        mode: "0644"
        content: |
          Types: deb
          URIs: https://packages.sury.org/php/
          Suites: {{ ansible_distribution_release }}
          Components: main
          Signed-By: /usr/share/keyrings/debsuryorg-archive-keyring.gpg
      register: pgacc_sury_repo

    - name: Install nginx, PHP 8.5 and PostgreSQL 18
      ansible.builtin.apt:
        name: [nginx, php8.5-fpm, php8.5-cli, php8.5-pgsql, php8.5-mbstring, postgresql-18]
        install_recommends: false
        update_cache: "{{ pgacc_sury_repo is changed }}"

    - name: List the PHP extensions
      ansible.builtin.command: php8.5 -m
      register: pgacc_php_modules
      changed_when: false

    - name: Check the PHP extensions pgacc needs
      ansible.builtin.assert:
        that: item in pgacc_php_modules.stdout_lines
        quiet: true
      loop: [pgsql, mbstring, iconv, zlib, sodium, openssl]

    # --- Users and layout: pgacc runs PHP, pgacc-deploy owns the releases

    - name: Create the users
      ansible.builtin.user:
        name: "{{ item }}"
        system: true
        shell: /usr/sbin/nologin
        home: /srv/pgacc
        create_home: false
      loop: [pgacc, pgacc-deploy]

    - name: Create the directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.owner }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: /srv/pgacc, owner: pgacc-deploy, mode: "0755" }
        - { path: /srv/pgacc/releases, owner: pgacc-deploy, mode: "0755" }
        - { path: /srv/pgacc/shared, owner: root, mode: "0755" }
        - { path: /srv/pgacc/shared/files, owner: pgacc, mode: "0700" }
        - { path: /var/log/pgacc, owner: pgacc, mode: "0750" }
        - { path: /var/backups/pgacc, owner: postgres, mode: "0700" }

    - name: Create constants.php if there is none
      ansible.builtin.copy:
        dest: /srv/pgacc/shared/constants.php
        force: false
        owner: root
        group: pgacc
        mode: "0640"
        content: |
          <?php
          // Generated by deploy/ansible. Keep a copy off this host: without
          // $key the stored receipts cannot be decrypted.
          // $datakey: RANDOM PLACEHOLDER, replace it with the key shared with
          // the membership system.
          $datakey = '{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_lowercase', 'digits'], length=64) }}';
          $key = '{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_lowercase', 'digits'], length=64) }}';
      no_log: true
      notify: Announce the new constants.php

    - name: Keep constants.php readable but not writable for PHP
      ansible.builtin.file:
        path: /srv/pgacc/shared/constants.php
        owner: root
        group: pgacc
        mode: "0640"

    # --- PHP-FPM, nginx, deploy command

    - name: Configure PHP
      ansible.builtin.template:
        src: php.ini.j2
        dest: "/etc/php/8.5/{{ item }}/conf.d/90-pgacc.ini"
        mode: "0644"
      loop: [fpm, cli]
      notify: Reload php-fpm

    - name: Configure the PHP-FPM pool
      ansible.builtin.template:
        src: php-fpm-pool.conf.j2
        dest: /etc/php/8.5/fpm/pool.d/pgacc.conf
        mode: "0644"
      notify: Reload php-fpm

    - name: Start PHP-FPM
      ansible.builtin.systemd_service:
        name: php8.5-fpm.service
        enabled: true
        state: started

    - name: Configure the nginx site
      ansible.builtin.template:
        src: nginx-site.conf.j2
        dest: /etc/nginx/sites-available/pgacc
        mode: "0644"
      notify: Reload nginx

    - name: Enable the nginx site
      ansible.builtin.file:
        src: ../sites-available/pgacc
        dest: /etc/nginx/sites-enabled/pgacc
        state: link
      notify: Reload nginx

    - name: Disable the default nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload nginx

    - name: Install pgacc-deploy
      ansible.builtin.copy:
        src: ../deploy.sh
        dest: /usr/local/bin/pgacc-deploy
        mode: "0755"

    - name: Allow pgacc-deploy to reload PHP-FPM
      ansible.builtin.copy:
        dest: /etc/sudoers.d/pgacc-deploy
        mode: "0440"
        validate: visudo -cf %s
        content: |
          pgacc-deploy ALL=(root) NOPASSWD: /usr/bin/systemctl reload php8.5-fpm.service

    - name: Rotate the PHP error log
      ansible.builtin.copy:
        src: logrotate
        dest: /etc/logrotate.d/pgacc
        mode: "0644"

    # --- Database: role pgacc (peer authentication), database accounting

    - name: Start PostgreSQL
      ansible.builtin.systemd_service:
        name: postgresql.service
        enabled: true
        state: started

    - name: Query the database role and owner
      ansible.builtin.command:
        argv:
          - runuser
          - -u
          - postgres
          - --
          - psql
          - -XtAc
          - >-
            SELECT (SELECT count(*) FROM pg_roles WHERE rolname = 'pgacc') || ':'
            || coalesce((SELECT pg_get_userbyid(datdba) FROM pg_database WHERE datname = 'accounting'), '')
      register: pgacc_db_state
      changed_when: false

    - name: Refuse an accounting database owned by another role
      ansible.builtin.fail:
        msg: >-
          The database accounting exists but is owned by {{ pgacc_db_state.stdout.split(':')[1] }},
          not pgacc. pgacc connects as pgacc; change the owner by hand
          (ALTER DATABASE accounting OWNER TO pgacc, and its objects) and run again.
      when: pgacc_db_state.stdout.split(':')[1] not in ['', 'pgacc']

    - name: Create the database role
      ansible.builtin.command: runuser -u postgres -- psql -Xq -c 'CREATE ROLE pgacc LOGIN'
      when: pgacc_db_state.stdout.split(':')[0] == '0'
      changed_when: true

    - name: Create the database with the schema
      when: pgacc_db_state.stdout.split(':')[1] == ''
      block:
        - name: Create the database
          ansible.builtin.command:
            argv: [runuser, -u, postgres, --, createdb, --owner=pgacc, --encoding=UTF8, --locale=C.UTF-8, --template=template0, accounting]
          changed_when: true

        - name: Load pgcrypto and restrict access
          ansible.builtin.command:
            argv: [runuser, -u, postgres, --, psql, -Xq, -v, ON_ERROR_STOP=1, -d, accounting, -f, -]
            stdin: |
              {{ lookup('ansible.builtin.file', pgacc_fixtures + '/pgcrypto.sql') }}
              REVOKE CONNECT, TEMPORARY ON DATABASE accounting FROM PUBLIC;
              GRANT CONNECT, TEMPORARY ON DATABASE accounting TO pgacc;
          changed_when: true

        - name: Load the schema as pgacc
          ansible.builtin.command:
            argv: [runuser, -u, pgacc, --, psql, -Xq, -v, ON_ERROR_STOP=1, --single-transaction, -d, accounting, -f, -]
            stdin: "{{ lookup('ansible.builtin.file', pgacc_fixtures + '/schema.sql') }}"
          changed_when: true
      rescue:
        - name: Drop the new database again
          ansible.builtin.command: runuser -u postgres -- dropdb --if-exists accounting
          changed_when: true

        - name: Stop
          ansible.builtin.fail:
            msg: Creating the database failed; dropped it so that a rerun starts clean.

    # --- Nightly local database dump (the host backs up the whole system)

    - name: Install the dump script
      ansible.builtin.copy:
        src: pgacc-backup
        dest: /usr/local/sbin/pgacc-backup
        mode: "0755"

    - name: Install the dump service
      ansible.builtin.template:
        src: pgacc-backup.service.j2
        dest: /etc/systemd/system/pgacc-backup.service
        mode: "0644"
      register: pgacc_backup_service

    - name: Install the dump timer
      ansible.builtin.copy:
        src: pgacc-backup.timer
        dest: /etc/systemd/system/pgacc-backup.timer
        mode: "0644"
      register: pgacc_backup_timer

    - name: Enable the dump timer
      ansible.builtin.systemd_service:
        name: pgacc-backup.timer
        enabled: true
        state: started
        daemon_reload: "{{ pgacc_backup_service is changed or pgacc_backup_timer is changed }}"

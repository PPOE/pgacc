# Example inventory: copy it outside the repository and fill in your host.
# 192.0.2.0/24 is a documentation range (RFC 5737), not a real address.
all:
  hosts:
    pgacc:
      ansible_host: 192.0.2.10
      ansible_user: root
      # A Proxmox LXC container instead (laptop -> SSH to the Proxmox host ->
      # pct exec), with the community.proxmox collection and paramiko
      # installed locally. The plugin runs `sudo pct exec` on the Proxmox host
      # and cannot answer a password prompt: allow that one command without a
      # password there (see README.md, "Provisioning").
      # ansible_connection: community.proxmox.proxmox_pct_remote
      # ansible_host: <address of the Proxmox host; paramiko ignores ~/.ssh/config>
      # ansible_port: <SSH port of the Proxmox host>
      # ansible_user: <your user on the Proxmox host>
      # ansible_become: false   # pct exec already runs as root in the container
      # proxmox_vmid: <container ID>
      ansible_python_interpreter: /usr/bin/python3
  vars:
    # Required: addresses or CIDR ranges of the TLS-terminating reverse proxy.
    # nginx accepts connections (and X-Forwarded-Proto) only from these and
    # from the host itself.
    pgacc_trusted_proxies:
      - 192.0.2.1
    # Optional (defaults shown).
    # pgacc_timezone: UTC   # Europe/Vienna with the membership sync (deploy/README.md)
    # pgacc_backup_keep_days: 7
    # pgacc_disable_sshd: true
    # The member list of the membership system (README.md, "Member list").
    # Off while pgacc_members_url is empty (the default); keep the token in
    # a vault (openssl rand -hex 32, once).
    # pgacc_members_url: https://192.0.2.20:8443/members.php
    # pgacc_members_token: "{{ vault_pgacc_members_token }}"
    # pgacc_members_cert: "{{ lookup('ansible.builtin.file', 'admidio-addons-tls.crt') }}"
    # /etc/hosts entries for names the internal DNS does not resolve (see
    # README.md, "Membership system"). Empty by default: nothing is written.
    # pgacc_extra_hosts:
    #   - { ip: 192.0.2.1, names: [members.example.org] }
    # The internal sync listener for the membership system (README.md,
    # "Internal sync listener"). Off while pgacc_sync_listen_address is
    # empty (the default).
    # pgacc_sync_listen_address: 192.0.2.10
    # pgacc_sync_peers: [192.0.2.20]
    # pgacc_payments_token: "{{ vault_pgacc_payments_token }}"   # openssl rand -hex 32
    # pgacc_sync_port: 8443

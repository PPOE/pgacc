# Lighttpd for the PHP 5.3 lane: Debian squeeze's stock /etc/lighttpd/lighttpd.conf
# with the stock fastcgi + fastcgi-php modules enabled ("lighty-enable-mod
# fastcgi fastcgi-php"), i.e. Lighttpd + PHP-CGI (FastCGI) like production.
#
# Deviations from the stock files, all test-only:
# - server.port 8080 and document-root /app (the application checkout);
# - no IPv6 listener (use-ipv6.pl), no dir-listing (production serves the app,
#   not directory indexes; it changes nothing for .php routes);
# - no server.errorlog file: Lighttpd then logs to stderr (the container log);
# - bin-copy-environment additionally passes the libpq PG* variables (the test
#   database) and PGACC_TEST_DIAGNOSTICS_DIR (diagnostics recorder) to PHP, and
#   for tests/reference/ libfaketime's variables and PGACC_REFERENCE_PGOPTIONS
#   (each only if set).
#   TZ is deliberately NOT passed: production's PHP sees no TZ and no
#   date.timezone, which PHP 5.3 reports on every date function call.

server.modules = (
	"mod_access",
	"mod_alias",
	"mod_compress",
	"mod_redirect",
	"mod_fastcgi",
)

server.port                 = 8080
server.document-root        = "/app"
server.upload-dirs          = ( "/var/cache/lighttpd/uploads" )
server.pid-file             = "/var/run/lighttpd.pid"
server.username             = "www-data"
server.groupname            = "www-data"

index-file.names            = ( "index.php", "index.html",
                                "index.htm", "default.htm",
                               " index.lighttpd.html" )

url.access-deny             = ( "~", ".inc" )

static-file.exclude-extensions = ( ".php", ".pl", ".fcgi" )

dir-listing.encoding        = "utf-8"
server.dir-listing          = "disable"

compress.cache-dir          = "/var/cache/lighttpd/compress/"
compress.filetype           = ( "application/x-javascript", "text/css", "text/html", "text/plain" )

include_shell "/usr/share/lighttpd/create-mime.assign.pl"

# /etc/lighttpd/conf-available/15-fastcgi-php.conf (squeeze), plus test variables.
fastcgi.server += ( ".php" =>
	((
		"bin-path" => "/usr/bin/php-cgi",
		"socket" => "/var/run/lighttpd/php.socket",
		"max-procs" => 1,
		"bin-environment" => (
			"PHP_FCGI_CHILDREN" => "4",
			"PHP_FCGI_MAX_REQUESTS" => "10000"
		),
		"bin-copy-environment" => (
			"PATH", "SHELL", "USER",
			"PGHOST", "PGPORT", "PGDATABASE", "PGUSER", "PGPASSWORD",
			"PGACC_TEST_DIAGNOSTICS_DIR",
			"LD_PRELOAD", "FAKETIME", "DONT_FAKE_MONOTONIC", "PGACC_REFERENCE_PGOPTIONS"
		),
		"broken-scriptfilename" => "enable"
	))
)

name: Tests

# CI cost policy (owner decision; tests/README.md, "Continuous integration"):
# - every push: lanes PHP 5.3 / PostgreSQL 8.4, PHP 7.4 / 18 (coverage) and
#   PHP 8.5 / 18, static analysis, the PHP 5 reference comparison on 5.3, 7.4
#   and 8.5, and mutation testing of the changed lines only
#   (tests/mutation/run.sh --changed-since);
# - weekly, manual runs and pull requests labelled `full-ci`: additionally
#   PHP 7.4 / PostgreSQL 8.4, every mutation target in full on every mutation
#   lane, and Infection.
# Pushes to branches other than master run through their pull request (any
# target branch) only, so each push starts one run.
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # Mondays 03:17 UTC.
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan (full or per-push run)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.plan.outputs.full }}
      base: ${{ steps.plan.outputs.base }}
      lanes: ${{ steps.plan.outputs.lanes }}
    steps:
      - name: Choose the lanes and the comparison base
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_REF: ${{ github.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          lanes='{"php":"5.3","pg":"8.4","project":"pgacc-test-php53","compose_files":"-f compose.test.yaml -f compose.php53.yaml"},{"php":"7.4","pg":"18","project":"pgacc-test-php74","compose_files":"-f compose.test.yaml -f compose.coverage.yaml"},{"php":"8.5","pg":"18","project":"pgacc-test-php85","compose_files":"-f compose.test.yaml -f compose.php85.yaml"}'
          case "$EVENT" in
            push)
              full=false
              # A new branch has no "before": compare with the default branch.
              if [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
                base="origin/$DEFAULT_BRANCH"
              else
                base=$BEFORE
              fi
              ;;
            pull_request)
              # Full run only when the pull request carries the full-ci label
              # (e.g. once before merging to master); otherwise per-push mode
              # against the previous head of the pull request.
              case ",$LABELS," in
                *,full-ci,*) full=true ;;
                *) full=false ;;
              esac
              if [ "$full" = false ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
                base=$BEFORE
              else
                base="origin/$BASE_REF"
              fi
              ;;
            *)
              full=true
              base=
              ;;
          esac
          if [ "$full" = true ]; then
            lanes="$lanes"',{"php":"7.4","pg":"8.4","project":"pgacc-test-pg84-php74","compose_files":"-f compose.test.yaml"}'
          fi
          {
            echo "full=$full"
            echo "base=$base"
            echo "lanes=[$lanes]"
          } >>"$GITHUB_OUTPUT"

  static-analysis:
    name: Static analysis (PHPCompatibility, PHPStan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run static analysis against the reviewed baselines
        run: sh tests/static-analysis.sh

  docker-harness:
    name: PHP ${{ matrix.php }} / PostgreSQL ${{ matrix.pg }} characterization harness
    needs: plan
    runs-on: ubuntu-latest
    # The 8.4 server and the PHP 5.3 lane build squeeze i386 images; full runs
    # mutation-test every target.
    timeout-minutes: ${{ needs.plan.outputs.full == 'true' && 60 || 30 }}
    # PHP 8.5 fails by design until PHP 5 support is dropped (implicit
    # connection deprecations, tests/COMPATIBILITY_PLAN.md): reported, not blocking.
    continue-on-error: ${{ matrix.php == '8.5' }}
    strategy:
      fail-fast: false
      matrix:
        # PHP 5.3 / 8.4: the production pair. PHP 7.4 / 18: coverage.
        # PHP 7.4 / 8.4: full runs only (plan job).
        include: ${{ fromJSON(needs.plan.outputs.lanes) }}
    env:
      PGACC_TEST_PG: ${{ matrix.pg }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Coverage and mutation compare with the push's or pull request's base.
          fetch-depth: 0

      - name: Resolve the comparison base
        id: base
        env:
          BASE: ${{ needs.plan.outputs.base }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # A force push's "before" may no longer exist: fall back to the
          # default branch.
          if [ -n "$BASE" ] && ! git merge-base "$BASE" HEAD >/dev/null 2>&1; then
            BASE="origin/$DEFAULT_BRANCH"
          fi
          echo "base=$BASE" >>"$GITHUB_OUTPUT"

      - name: Run application checks
        env:
          # PHP 7.4 / PostgreSQL 18 lane only: fail if a changed executable
          # line is uncovered (tests/run.sh ignores it on other lanes). Empty
          # on scheduled and manual runs (full report, no gate).
          PGACC_COVERAGE_BASE: ${{ steps.base.outputs.base }}
        run: sh tests/run.sh '${{ matrix.php }}'

      - name: Publish coverage summary
        if: always() && matrix.php == '7.4' && matrix.pg == '18'
        run: |
          if [ -f build/coverage/summary.txt ]; then
            { echo '```'; cat build/coverage/summary.txt; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always() && matrix.php == '7.4' && matrix.pg == '18'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-php74
          path: build/coverage
          if-no-files-found: warn

      - name: Mutation tests of the changed lines
        # Per push: only mutations whose search region overlaps a changed
        # line (tests/mutation/ci.sh, run.sh --changed-since). No mutation on
        # PHP 5.3 (the runner needs PHP's built-in server).
        if: always() && matrix.php != '5.3' && needs.plan.outputs.full != 'true'
        run: sh tests/mutation/ci.sh '${{ matrix.php }}' '--changed-since=${{ steps.base.outputs.base }}'

      - name: Mutation tests, all targets
        if: always() && matrix.php != '5.3' && needs.plan.outputs.full == 'true'
        run: sh tests/mutation/ci.sh '${{ matrix.php }}'

      - name: Upload mutation results
        if: always() && matrix.php != '5.3'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-php${{ matrix.php }}-pg${{ matrix.pg }}
          path: build/mutation
          if-no-files-found: warn

      - name: Clean up containers
        if: always()
        run: docker compose --project-name '${{ matrix.project }}' ${{ matrix.compose_files }} down --volumes --remove-orphans

  reference:
    # PHP 5 golden master (tests/reference/, tests/README.md), recorded on the
    # production pair PHP 5.3 / PostgreSQL 8.4: that lane must reproduce it
    # byte for byte; PHP 7.4 and 8.5 (PostgreSQL 18) must match it except for
    # reviewed tests/reference/allowlist.php entries (accepted/todo).
    # Failures stay visible: not continue-on-error.
    name: PHP 5 reference comparison (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    # PHP 5.3 builds the squeeze server, its PHP 5.6 client and the 8.4 server.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['5.3', '7.4', '8.5']
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Compare with the PHP 5 reference
        run: sh tests/reference/run.sh compare '${{ matrix.php }}'

      - name: Publish comparison summary
        if: always()
        run: |
          report="build/reference/php$(echo '${{ matrix.php }}' | tr -d .)/report.txt"
          if [ -f "$report" ]; then
            { echo '```'; head -n 80 "$report"; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload comparison report and recording
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reference-php${{ matrix.php }}
          path: build/reference
          if-no-files-found: warn

  mutation:
    # Full runs only. Report only: Infection results are not a required gate
    # yet. See tests/mutation/README.md for the baseline and threshold plan.
    name: Infection mutation report (${{ matrix.target }}, PHP ${{ matrix.php }}, non-blocking)
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.5']
        # functions: functions.php through the class wrapper; shim: the wrapper itself.
        target: [functions, shim]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Run Infection
        env:
          PGACC_INFECTION_TARGET: ${{ matrix.target }}
        run: sh tests/mutation/infection.sh '${{ matrix.php }}'

      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: infection-${{ matrix.target }}-php${{ matrix.php }}
          path: tests/mutation/results/
          if-no-files-found: ignore

name: Tests

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: PHP syntax compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run syntax compatibility matrix
        run: sh tests/php-syntax-matrix.sh

  static-analysis:
    name: Static analysis (PHPCompatibility, PHPStan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run static analysis against the reviewed baselines
        run: sh tests/static-analysis.sh

  docker-harness:
    name: PHP ${{ matrix.php }} / PostgreSQL ${{ matrix.pg }} characterization harness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # PostgreSQL 17 is the default server for every PHP lane; PHP 7.4 also
        # runs against 9.4 (oldest pullable stand-in for production 8.4) and
        # 18. Coverage is collected only on PHP 7.4 / PostgreSQL 17.
        include:
          - php: '7.4'
            pg: '17'
            project: pgacc-test-php74
            compose_files: -f compose.test.yaml -f compose.coverage.yaml
          - php: '7.4'
            pg: '9.4'
            project: pgacc-test-pg94-php74
            compose_files: -f compose.test.yaml
          - php: '7.4'
            pg: '18'
            project: pgacc-test-pg18-php74
            compose_files: -f compose.test.yaml
          - php: '5.6'
            pg: '17'
            project: pgacc-test-php56
            compose_files: -f compose.test.yaml
          - php: '8.0'
            pg: '17'
            project: pgacc-test-php80
            compose_files: -f compose.test.yaml
          - php: '8.5'
            pg: '17'
            project: pgacc-test-php85
            compose_files: -f compose.test.yaml
    env:
      PGACC_TEST_PG: ${{ matrix.pg }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # The PHP 7.4 lane compares pull requests with their base branch.
          fetch-depth: 0

      - name: Run application checks
        env:
          # PHP 7.4 / PostgreSQL 17 lane only: fail if a changed executable
          # line is uncovered (tests/run.sh ignores it on other lanes).
          PGACC_COVERAGE_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: sh tests/run.sh '${{ matrix.php }}'

      - name: Publish coverage summary
        if: always() && matrix.php == '7.4' && matrix.pg == '17'
        run: |
          if [ -f build/coverage/summary.txt ]; then
            { echo '```'; cat build/coverage/summary.txt; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always() && matrix.php == '7.4' && matrix.pg == '17'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-php74
          path: build/coverage
          if-no-files-found: warn

      - name: Mutation runner self-test, rights2orgasql and null-arguments mutations
        if: always()
        # Reuses the lane image built above; see tests/mutation/README.md.
        run: |
          sh tests/mutation/run.sh '${{ matrix.php }}' --self-test
          sh tests/mutation/run.sh '${{ matrix.php }}' rights2orgasql
          sh tests/mutation/run.sh '${{ matrix.php }}' null-arguments

      - name: login-logout mutations
        # Not on PHP 8.5: the unmutated baseline fails there (implicit
        # PostgreSQL connection deprecations before the login redirect).
        if: always() && matrix.php != '8.5'
        run: sh tests/mutation/run.sh '${{ matrix.php }}' login-logout

      - name: redirects mutations
        # Only on PHP 5.6 and 7.4: on PHP 8 the unmutated baseline fails
        # (write-workflows.php fails on PHP 8 diagnostics without entries).
        if: always() && (matrix.php == '5.6' || matrix.php == '7.4')
        run: sh tests/mutation/run.sh '${{ matrix.php }}' redirects

      - name: rights-checks mutations
        # Only on PHP 5.6 and 7.4, like the redirects target.
        if: always() && (matrix.php == '5.6' || matrix.php == '7.4')
        run: sh tests/mutation/run.sh '${{ matrix.php }}' rights-checks

      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-php${{ matrix.php }}${{ matrix.pg != '17' && format('-pg{0}', matrix.pg) || '' }}
          path: build/mutation
          if-no-files-found: warn

      - name: Clean up containers
        if: always()
        run: docker compose --project-name '${{ matrix.project }}' ${{ matrix.compose_files }} down --volumes --remove-orphans

  mutation:
    # Report only: Infection results are not a required gate yet. See
    # tests/mutation/README.md for the baseline and threshold plan.
    name: Infection mutation report (${{ matrix.target }}, PHP ${{ matrix.php }}, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.5']
        # functions: functions.php through the class wrapper; shim: the wrapper itself.
        target: [functions, shim]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Run Infection
        env:
          PGACC_INFECTION_TARGET: ${{ matrix.target }}
        run: sh tests/mutation/infection.sh '${{ matrix.php }}'

      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: infection-${{ matrix.target }}-php${{ matrix.php }}
          path: tests/mutation/results/
          if-no-files-found: ignore

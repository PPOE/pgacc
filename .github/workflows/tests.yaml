name: Tests

# CI cost policy (owner decision; tests/README.md, "Continuous integration"):
# - every push: the only lane, PHP 8.5 / PostgreSQL 18 (with coverage and
#   the changed-line gate), static analysis and the PHP 5 reference
#   comparison on 8.5;
# - pull requests labelled `mutation`: additionally mutation testing of the
#   changed lines only (tests/mutation/run.sh --changed-since);
# - weekly, manual runs and pull requests labelled `full-ci`: additionally
#   every mutation target in full, and Infection.
# Pushes to branches other than master run through their pull request (any
# target branch) only, so each push starts one run.
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # Mondays 03:17 UTC.
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan (full or per-push run)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.plan.outputs.full }}
      base: ${{ steps.plan.outputs.base }}
      mutation: ${{ steps.plan.outputs.mutation }}
      lanes: ${{ steps.plan.outputs.lanes }}
    steps:
      - name: Choose the lanes and the comparison base
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_REF: ${{ github.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          lanes='{"php":"8.5","pg":"18","project":"pgacc-test-php85","compose_files":"-f compose.test.yaml -f compose.coverage.yaml"}'
          mutation=false
          case "$EVENT" in
            push)
              full=false
              # A new branch has no "before": compare with the default branch.
              if [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
                base="origin/$DEFAULT_BRANCH"
              else
                base=$BEFORE
              fi
              ;;
            pull_request)
              # Full run only when the pull request carries the full-ci label
              # (e.g. once before merging to master); otherwise per-push mode
              # against the previous head of the pull request.
              case ",$LABELS," in
                *,full-ci,*) full=true ;;
                *) full=false ;;
              esac
              case ",$LABELS," in
                *,mutation,*) mutation=true ;;
              esac
              if [ "$full" = false ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
                base=$BEFORE
              else
                base="origin/$BASE_REF"
              fi
              ;;
            *)
              full=true
              base=
              ;;
          esac
          {
            echo "full=$full"
            echo "base=$base"
            if [ "$full" = true ]; then mutation=true; fi
            echo "mutation=$mutation"
            echo "lanes=[$lanes]"
          } >>"$GITHUB_OUTPUT"

  static-analysis:
    name: Static analysis (PHPCompatibility, PHPStan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run static analysis against the reviewed baselines
        run: sh tests/static-analysis.sh
      - name: Self-test of the token-equivalence check (changed-line gates)
        run: sh tests/coverage/token-equivalence.sh --self-test

  docker-harness:
    name: PHP ${{ matrix.php }} / PostgreSQL ${{ matrix.pg }} characterization harness
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # PHP 8.5 / PostgreSQL 18, the only lane (plan job).
        include: ${{ fromJSON(needs.plan.outputs.lanes) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Coverage compares with the push's or pull request's base.
          fetch-depth: 0

      - name: Resolve the comparison base
        id: base
        env:
          BASE: ${{ needs.plan.outputs.base }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # A force push's "before" may no longer exist: fall back to the
          # default branch.
          if [ -n "$BASE" ] && ! git merge-base "$BASE" HEAD >/dev/null 2>&1; then
            BASE="origin/$DEFAULT_BRANCH"
          fi
          echo "base=$BASE" >>"$GITHUB_OUTPUT"

      - name: Run application checks
        env:
          # Fail if a changed executable line is uncovered. Empty on
          # scheduled and manual runs (full report, no gate).
          PGACC_COVERAGE_BASE: ${{ steps.base.outputs.base }}
        run: sh tests/run.sh '${{ matrix.php }}'

      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f build/coverage/summary.txt ]; then
            { echo '```'; cat build/coverage/summary.txt; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-php85
          path: build/coverage
          if-no-files-found: warn

      - name: Clean up containers
        if: always()
        run: docker compose --project-name '${{ matrix.project }}' ${{ matrix.compose_files }} down --volumes --remove-orphans

  mutation-runner:
    # Target-driven mutation testing (tests/mutation/ci.sh), blocking when it
    # runs: pull requests labelled `mutation` (changed lines only) or
    # `full-ci`, weekly and manual runs (every target). Skipped otherwise.
    name: Mutation tests (PHP ${{ matrix.php }} / PostgreSQL ${{ matrix.pg }})
    needs: plan
    if: needs.plan.outputs.mutation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ needs.plan.outputs.full == 'true' && 60 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.lanes) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Changed-line mutation compares with the push's or pull request's base.
          fetch-depth: 0

      - name: Resolve the comparison base
        id: base
        env:
          BASE: ${{ needs.plan.outputs.base }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # A force push's "before" may no longer exist: fall back to the
          # default branch.
          if [ -n "$BASE" ] && ! git merge-base "$BASE" HEAD >/dev/null 2>&1; then
            BASE="origin/$DEFAULT_BRANCH"
          fi
          echo "base=$BASE" >>"$GITHUB_OUTPUT"

      - name: Mutation tests of the changed lines
        # `mutation` label: only mutations whose search region overlaps a
        # changed line (tests/mutation/ci.sh, run.sh --changed-since). Adding
        # the label compares with the pull request's base.
        if: needs.plan.outputs.full != 'true'
        run: sh tests/mutation/ci.sh '${{ matrix.php }}' '--changed-since=${{ steps.base.outputs.base }}'

      - name: Mutation tests, all targets
        if: needs.plan.outputs.full == 'true'
        run: sh tests/mutation/ci.sh '${{ matrix.php }}'

      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-php${{ matrix.php }}-pg${{ matrix.pg }}
          path: build/mutation
          if-no-files-found: warn

      - name: Clean up containers
        if: always()
        run: docker compose --project-name 'pgacc-mutation-php85' -f compose.test.yaml down --volumes --remove-orphans

  reference:
    # PHP 5 golden master (tests/reference/, tests/README.md), recorded on the
    # former production pair PHP 5.3 / PostgreSQL 8.4 before php5-last and kept
    # as the historical reference: PHP 8.5 / PostgreSQL 18 must match it except
    # for reviewed tests/reference/allowlist.php entries (accepted/todo).
    # Failures stay visible: not continue-on-error.
    name: PHP 5 reference comparison (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Compare with the PHP 5 reference
        run: sh tests/reference/run.sh compare '${{ matrix.php }}'

      - name: Publish comparison summary
        if: always()
        run: |
          report="build/reference/php$(echo '${{ matrix.php }}' | tr -d .)/report.txt"
          if [ -f "$report" ]; then
            { echo '```'; head -n 80 "$report"; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload comparison report and recording
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reference-php${{ matrix.php }}
          path: build/reference
          if-no-files-found: warn

  mutation:
    # Full runs only. Report only: Infection results are not a required gate
    # yet. See tests/mutation/README.md for the baseline and threshold plan.
    name: Infection mutation report (${{ matrix.target }}, PHP ${{ matrix.php }}, non-blocking)
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']
        # functions: functions.php through the class wrapper; shim: the wrapper itself.
        target: [functions, shim]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Run Infection
        env:
          PGACC_INFECTION_TARGET: ${{ matrix.target }}
        run: sh tests/mutation/infection.sh '${{ matrix.php }}'

      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: infection-${{ matrix.target }}-php${{ matrix.php }}
          path: tests/mutation/results/
          if-no-files-found: ignore

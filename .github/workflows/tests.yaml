name: Tests

# CI cost policy (owner decision; tests/README.md, "Continuous integration"):
# - every push: the only lane, PHP 8.5 / PostgreSQL 18 (with coverage and
#   the changed-line gate), static analysis and the reference comparison
#   on 8.5;
# - pull requests labelled `mutation`: additionally mutation testing of the
#   changed lines only (tests/mutation/run.sh --changed-since);
# - weekly, manual runs and pull requests labelled `full-ci`: additionally
#   every mutation target in full, and Infection.
# Pushes to branches other than master run through their pull request (any
# target branch) only, so each push starts one run.
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # Mondays 03:17 UTC.
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan (full or per-push run)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.plan.outputs.full }}
      base: ${{ steps.plan.outputs.base }}
      mutation: ${{ steps.plan.outputs.mutation }}
    steps:
      - name: Choose the run mode and the comparison base
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_REF: ${{ github.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          mutation=false
          case "$EVENT" in
            push)
              full=false
              # A new branch has no "before": compare with the default branch.
              if [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
                base="origin/$DEFAULT_BRANCH"
              else
                base=$BEFORE
              fi
              ;;
            pull_request)
              # Full run only when the pull request carries the full-ci label
              # (e.g. once before merging to master); otherwise per-push mode
              # against the previous head of the pull request.
              case ",$LABELS," in
                *,full-ci,*) full=true ;;
                *) full=false ;;
              esac
              case ",$LABELS," in
                *,mutation,*) mutation=true ;;
              esac
              if [ "$full" = false ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
                base=$BEFORE
              else
                base="origin/$BASE_REF"
              fi
              ;;
            *)
              full=true
              base=
              ;;
          esac
          {
            echo "full=$full"
            echo "base=$base"
            if [ "$full" = true ]; then mutation=true; fi
            echo "mutation=$mutation"
          } >>"$GITHUB_OUTPUT"

  static-analysis:
    name: Static analysis (PHPCompatibility, PHPStan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run static analysis against the reviewed baselines
        run: sh tests/static-analysis.sh
      - name: Check the formatting (PER-CS 3.0, whitespace rules only)
        run: sh scripts/format.sh --check --ci
      - name: Check that style.css is the build of css/app.css (Tailwind CSS)
        run: sh scripts/build-css.sh --check

  web-server:
    # The request matrix of the document root public/ (tests/web-server/
    # matrix.php) against real servers: nginx with the rendered site template
    # of deploy/ansible, and Apache with public/.htaccess, the virtual host of
    # UPGRADING.md and the release root's deny-all .htaccess.
    name: Web server allow lists (nginx, Apache)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run the request matrix against nginx and Apache
        run: sh tests/web-server/run.sh

  docker-harness:
    name: PHP 8.5 / PostgreSQL 18 characterization harness
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Coverage compares with the push's or pull request's base.
          fetch-depth: 0

      - name: Resolve the comparison base
        id: base
        env:
          BASE: ${{ needs.plan.outputs.base }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # A force push's "before" may no longer exist: fall back to the
          # default branch.
          if [ -n "$BASE" ] && ! git merge-base "$BASE" HEAD >/dev/null 2>&1; then
            BASE="origin/$DEFAULT_BRANCH"
          fi
          echo "base=$BASE" >>"$GITHUB_OUTPUT"

      - name: Run application checks
        env:
          # Fail if a changed executable line is uncovered. Empty on
          # scheduled and manual runs (full report, no gate).
          PGACC_COVERAGE_BASE: ${{ steps.base.outputs.base }}
        run: sh tests/run.sh 8.5

      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f build/coverage/summary.txt ]; then
            { echo '```'; cat build/coverage/summary.txt; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-php85
          path: build/coverage
          if-no-files-found: warn

      - name: Clean up containers
        if: always()
        run: docker compose --project-name pgacc-test-php85 -f compose.test.yaml -f compose.coverage.yaml down --volumes --remove-orphans

  mutation-runner:
    # Target-driven mutation testing (tests/mutation/ci.sh), blocking when it
    # runs: pull requests labelled `mutation` (changed lines only) or
    # `full-ci`, weekly and manual runs (every target). Skipped otherwise.
    # Time limits: 60 minutes for the changed lines (a receipt target alone
    # has about 170 mutants at about 15 s), 120 for every target.
    name: Mutation tests (PHP 8.5 / PostgreSQL 18)
    needs: plan
    if: needs.plan.outputs.mutation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ needs.plan.outputs.full == 'true' && 120 || 60 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Changed-line mutation compares with the push's or pull request's base.
          fetch-depth: 0

      - name: Resolve the comparison base
        id: base
        env:
          BASE: ${{ needs.plan.outputs.base }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # A force push's "before" may no longer exist: fall back to the
          # default branch.
          if [ -n "$BASE" ] && ! git merge-base "$BASE" HEAD >/dev/null 2>&1; then
            BASE="origin/$DEFAULT_BRANCH"
          fi
          echo "base=$BASE" >>"$GITHUB_OUTPUT"

      - name: Mutation tests of the changed lines
        # `mutation` label: only mutations whose search region overlaps a
        # changed line (tests/mutation/ci.sh, run.sh --changed-since). Adding
        # the label compares with the pull request's base.
        if: needs.plan.outputs.full != 'true'
        run: sh tests/mutation/ci.sh 8.5 '--changed-since=${{ steps.base.outputs.base }}'

      - name: Mutation tests, all targets
        if: needs.plan.outputs.full == 'true'
        run: sh tests/mutation/ci.sh 8.5

      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-php8.5-pg18
          path: build/mutation
          if-no-files-found: warn

      - name: Clean up containers
        if: always()
        run: docker compose --project-name 'pgacc-mutation-php85' -f compose.test.yaml down --volumes --remove-orphans

  reference:
    # Golden master (tests/reference/php85/, tests/README.md), recorded on
    # PHP 8.5 / PostgreSQL 18: the same lane must match it byte for byte except
    # for reviewed tests/reference/allowlist.php entries (none today).
    # Failures stay visible: not continue-on-error.
    name: Reference comparison (PHP 8.5)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Compare with the reference recording
        run: sh tests/reference/run.sh compare 8.5

      - name: Publish comparison summary
        if: always()
        run: |
          report=build/reference/php85/report.txt
          if [ -f "$report" ]; then
            { echo '```'; head -n 80 "$report"; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload comparison report and recording
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reference-php8.5
          path: build/reference
          if-no-files-found: warn

  mutation:
    # Full runs only. Report only: Infection results are not a required gate
    # yet. See tests/mutation/README.md for the baseline and threshold plan.
    name: Infection mutation report (${{ matrix.target }}, PHP 8.5, non-blocking)
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # functions: functions.php through the class wrapper; shim: the wrapper itself.
        target: [functions, shim]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Run Infection
        env:
          PGACC_INFECTION_TARGET: ${{ matrix.target }}
        run: sh tests/mutation/infection.sh 8.5

      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: infection-${{ matrix.target }}-php8.5
          path: tests/mutation/results/
          if-no-files-found: ignore
